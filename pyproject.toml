[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hextraj = ["data/**/*"]

[tool.setuptools_scm]

[project]
name = "hextraj"
dynamic = ["version"]
description = "Hex labelling of trajectory data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Willi Rath", email = "wrath@geomar.de" }]
requires-python = ">=3.10"
keywords = [
    "hexagonal grid",
    "trajectory analysis",
    "connectivity",
    "oceanography",
    "geospatial",
    "xarray",
    "dask",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "numpy",
    "pyproj",
    "pandas",
    "xarray",
    "geopandas",
    "shapely",
]

[project.optional-dependencies]
full = ["dask[dataframe]"]
dev  = ["hextraj[full]", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/willirath/hextraj"
Documentation = "https://willirath.github.io/hextraj/"
Repository = "https://github.com/willirath/hextraj"
# Concept DOI: resolves to the most recent Zenodo release.
DOI = "https://doi.org/10.5281/zenodo.22040740"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hextraj"]
# Vendored hex math from redblobgames.com (CC0). Excluded from mypy too.
omit = ["*/hextraj/redblobhex.py", "*/hextraj/redblobhex_array.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
ignore_missing_imports = true
exclude = ["src/hextraj/redblobhex\\.py", "src/hextraj/redblobhex_array\\.py"]

[tool.isort]
known_third_party = ["dask", "geopandas", "numpy", "pandas", "pyproj", "pytest", "setuptools", "shapely", "xarray"]
