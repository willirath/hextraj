name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git history.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          locked: false

      - name: Run tests
        run: pixi run test
